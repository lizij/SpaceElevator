  <script>
    // 兼容以 /index.html 结尾的直达链接：规范化为目录路径，保证应用内路由匹配根路径
    (function () {
      if (/\/index\.html$/i.test(location.pathname)) {
        history.replaceState(null, '',
          location.pathname.replace(/index\.html$/i, '') + location.search + location.hash);
      }
    })();
  </script>
  <script>
    // 独立静态归档运行：页面是纯前端 3D 应用，不依赖任何平台后端。
    // 静默平台 SDK 死代码对运行时接口的探测，保证任意静态托管（含 GitHub Pages）下无报错噪音。
    (function () {
      function stubFor(url) {
        if (/current_server_timestamp/.test(url)) {
          return { status_code: 0, code: 0, data: { timestampNs: String(BigInt(Date.now()) * 1000000n) } };
        }
        if (/get_published/.test(url)) {
          return { status_code: '0', code: 0, data: { app_runtime_extra: { bucket: { default_bucket_id: 'local' } } } };
        }
        if (/lark\/user_info|account/.test(url)) {
          return { code: 0, data: { user_info: { user_id: 'local', name: '', avatar: '' } } };
        }
        if (/observability|collect/.test(url)) {
          return { status_code: 0, code: 0 };
        }
        if (/routes\.json/.test(url)) return null;
        return { code: 0, status_code: 0, data: {} };
      }
      var RUNTIME_RE = /\/(__runtime__|spark)\/|routes\.json/;
      var of = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (RUNTIME_RE.test(url)) {
          var body = stubFor(url);
          if (body === null) return Promise.resolve(new Response('null', { status: 404, headers: { 'content-type': 'application/json' } }));
          return Promise.resolve(new Response(JSON.stringify(body), {
            status: 200, headers: { 'content-type': 'application/json' },
          }));
        }
        return of.apply(this, arguments);
      };
    })();
  </script>
