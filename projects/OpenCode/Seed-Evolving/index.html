    <div id="app"></div>

    <!-- 热点标注层 -->
    <div id="hotspots" aria-hidden="false"></div>

    <!-- 顶部标题 -->
    <header class="hud header">
      <h1>太空电梯 <span>SPACE ELEVATOR</span></h1>

    <!-- 右上角控制按钮 -->

    <!-- 热点说明卡片 -->
    <section id="detail" class="hud detail hidden">
      <button id="detail-close" type="button" aria-label="关闭">×</button>
      <h2 id="detail-title"></h2>
      <p id="detail-text"></p>
    </section>

    <!-- 底部操作提示 -->
    <footer class="hud hint">
      <span>🖱️ 拖拽旋转</span><i>·</i><span>滚轮 / 双指缩放</span><i>·</i><span>点击标注聚焦</span><i>·</i><span>按 P 暂停</span>
    </footer>

    <!-- 暗角 + 电影调色叠加 -->
    <div class="vignette"></div>
    <div class="grade"></div>

    <!-- 发射瞬间全屏闪光 -->
    <div id="launch-flash" class="flash"></div>

    <!-- 首帧加载提示 -->
    <div id="loader">正在构建太空电梯…</div>
