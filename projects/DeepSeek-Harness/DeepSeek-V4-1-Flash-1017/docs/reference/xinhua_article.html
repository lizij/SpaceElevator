                    el.onload = function () { finish(); };
                    el.onerror = function () { finish(); };
                }
                setTimeout(function () {
                    if (!done) finish();
                }, timeoutMs);
            }
            function poll() {
                var el = document.getElementById('beacon-aplus');
                if (el) {
                    bindScript(el);
                    return;
