<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#070b12"/>

  <g transform="translate(600 600)">
    <!-- outer harbor -->
    <circle r="540" fill="#0a1420" stroke="#5d7894" stroke-width="2"/>
    <circle r="515" fill="none" stroke="#2b3f54" stroke-width="1" stroke-dasharray="6 10"/>
    <circle r="450" fill="#08131f" stroke="#45617c" stroke-width="1.5"/>
    <circle r="420" fill="none" stroke="#24384b" stroke-width="1"/>

    <!-- radial bridges -->
    <g stroke="#6b8197" stroke-width="10">
      <line x1="450" y1="0" x2="600" y2="0"/>
      <line x1="-450" y1="0" x2="-600" y2="0"/>
      <line x1="225" y1="390" x2="300" y2="520"/>
      <line x1="-225" y1="390" x2="-300" y2="520"/>
      <line x1="225" y1="-390" x2="300" y2="-520"/>
      <line x1="-225" y1="-390" x2="-300" y2="-520"/>
    </g>
    <g stroke="#2f4356" stroke-width="2">
      <line x1="450" y1="0" x2="600" y2="0"/>
      <line x1="-450" y1="0" x2="-600" y2="0"/>
      <line x1="225" y1="390" x2="300" y2="520"/>
      <line x1="-225" y1="390" x2="-300" y2="520"/>
      <line x1="225" y1="-390" x2="300" y2="-520"/>
      <line x1="-225" y1="-390" x2="-300" y2="-520"/>
    </g>

    <!-- ring truss -->
    <circle r="300" fill="none" stroke="#d7e3f2" stroke-width="6" stroke-opacity="0.8"/>
    <circle r="286" fill="none" stroke="#8fa9c2" stroke-width="1.5" stroke-dasharray="3 6"/>
    <path d="M 0 -300 L 259.8 150 L -259.8 150 Z" fill="none" stroke="#b9cbe0" stroke-width="2" stroke-opacity="0.55"/>

    <!-- central shaft -->
    <circle r="82" fill="#0b1926" stroke="#e8f1ff" stroke-width="3"/>
    <circle r="58" fill="#0d2032" stroke="#8fc8ff" stroke-width="1.5"/>
    <circle r="7" fill="#ff5d5d"/>

    <!-- 12 launch gantry groups: 3 groups x 4, radius 205 -->
    <g fill="#1a2735" stroke="#ffb347" stroke-width="2">
      <!-- group A centered 30deg: -15, 15, 45, 75 -->
      <rect x="190" y="-18" width="34" height="36" transform="rotate(-15)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(15)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(45)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(75)" />
      <!-- group B centered 150deg: 105, 135, 165, 195 -->
      <rect x="190" y="-18" width="34" height="36" transform="rotate(105)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(135)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(165)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(195)" />
      <!-- group C centered 270deg: 225, 255, 285, 315 -->
      <rect x="190" y="-18" width="34" height="36" transform="rotate(225)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(255)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(285)" />
      <rect x="190" y="-18" width="34" height="36" transform="rotate(315)" />
    </g>

    <!-- 3 main towers at 90, 210, 330 -->
    <g>
      <g transform="rotate(90) translate(0 -300)">
        <rect x="-52" y="-52" width="104" height="104" fill="#dfe8f3" stroke="#ffffff" stroke-width="2"/>
        <rect x="-34" y="-34" width="68" height="68" fill="#9fb3c8"/>
        <circle r="7" fill="#ff5d5d"/>
      </g>
      <g transform="rotate(210) translate(0 -300)">
        <rect x="-52" y="-52" width="104" height="104" fill="#dfe8f3" stroke="#ffffff" stroke-width="2"/>
        <rect x="-34" y="-34" width="68" height="68" fill="#9fb3c8"/>
        <circle r="7" fill="#ff5d5d"/>
      </g>
      <g transform="rotate(330) translate(0 -300)">
        <rect x="-52" y="-52" width="104" height="104" fill="#dfe8f3" stroke="#ffffff" stroke-width="2"/>
        <rect x="-34" y="-34" width="68" height="68" fill="#9fb3c8"/>
        <circle r="7" fill="#ff5d5d"/>
      </g>
    </g>

    <!-- labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#cfe0f2">
      <text x="20" y="14" fill="#ff8a8a" font-size="14">中央井 / 216 缆索</text>
      <text x="320" y="-280" fill="#e8f1ff">主塔 ×3</text>
      <text x="320" y="-258" fill="#7f95ab" font-size="13">120° 分布 / 高 2 km</text>
      <text x="-455" y="250" fill="#ffc56e">发射塔 3 组 × 4</text>
      <text x="-455" y="270" fill="#8a7a62" font-size="13">每组双格构塔</text>
      <text x="470" y="0" fill="#9db4ca">外圈港池</text>
      <text x="470" y="20" fill="#63798f" font-size="13">半径约 1.5 km</text>
      <text x="-565" y="430" fill="#9db4ca">放射栈桥 / 码头</text>
    </g>
  </g>

  <text x="60" y="60" fill="#e8f1ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="4">BASE PLAN — 推定布局</text>
  <text x="60" y="112" fill="#6f8299" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Diameter 3 km · height 2 km · 3 main towers · 12 launch gantries in 3 groups · central 216-cable shaft</text>
  <text x="60" y="1150" fill="#526578" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Schematic only. Positions are inferred from the official art sheets, not an official orthographic drawing.</text>
</svg>
