name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 经典 gh-pages 分支发布模式：构建后把 dist/ 推到 orphan 的 gh-pages 分支，
# GitHub 检测到 gh-pages 分支即自动提供 Pages（无需在 Settings 手动选择 Source）
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Build collection
        # 编排脚本会为每个子项目 npm install + build，并把全部产物汇总到根 dist/
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm run build

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
